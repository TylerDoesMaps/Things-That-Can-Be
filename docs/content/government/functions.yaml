# The fixed list of what government does, and who holds each function at each level.
# 'kansas' is the real equivalent; checked: true means it was confirmed against a source.
- id: police
  name: Police protection
  group: Safety and justice
  census:
  - '062'
  - '162'
  levels:
    federal:
      department: Department of Justice
      title: Attorney General
      chosen: appointed
      by: the President
      cabinet: true
    state:
      department: State Police
      title: Superintendent
      chosen: appointed
      by: the Governor
      cabinet: false
      kansas:
        department: Kansas Highway Patrol
        title: Superintendent
        chosen: appointed
        by: the Governor
        cabinet: true
        checked: true
        note: The Kansas Bureau of Investigation is separate; its director is appointed by the Attorney General (not checked).
    county:
      department: Sheriff's Office
      title: Sheriff
      chosen: elected
      kansas:
        department: Sheriff's Office
        title: Sheriff
        chosen: elected
        checked: true
    city:
      department: Police Department
      title: Chief of Police
      chosen: appointed
      by: the city manager or mayor
      kansas:
        department: Police Department
        title: Chief of Police
        chosen: appointed
        by: the city governing body or manager
        checked: false
