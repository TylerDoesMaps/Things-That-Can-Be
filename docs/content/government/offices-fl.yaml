# Every seat that represents one address, by government. Florida.
# kind: executive, legislator, row officer, judge, board.
# player: yes (can hold now), later (planned, not built first), no.
# next: the first regular election after the game starts in November 2024. every: years between elections for that seat.
# checked: true means the line was confirmed against a source in 'source'.
state: Florida
cutoff:
  people: 15000
  cap: 30
  rule: A city gets its real structure if it has more than 15,000 people and is among the 30 largest in the state, or if it is the player's home. Florida has no default form of city government, so every other city is given a mayor and four commissioners.

rules:
- name: Resign to run
  rule: An officer whose term would overlap must resign to run for another state, district, county, city or federal office. The resignation is filed at least 10 days before qualifying opens and cannot be taken back.
  checked: true
  source: F.S. 99.012(3) and (4)
- name: One office per election
  rule: Nobody may qualify for more than one office if the terms overlap.
  checked: true
  source: F.S. 99.012(2)
- name: Party switching
  rule: A party's candidate must have been registered in that party for 365 days before qualifying opens. A candidate with no party must have belonged to none for the same 365 days. This does the work of a sore loser law.
  checked: true
  source: F.S. 99.021(1)
- name: Two offices at once
  rule: Nobody may hold two state, county or city offices at the same time.
  checked: false
- name: Nonpartisan races
  rule: Judges and school boards have no party on the ballot. Most cities are nonpartisan by their own charter. Party still counts with voters, at reduced weight.
  checked: false
- name: Open and closed primaries
  rule: Primaries are closed to other parties' voters. If the primary winner would face nobody in November, every voter may vote in it, unless a write-in candidate files.
  checked: false
- name: Term limits
  rule: Governor two terms in a row. Legislators and school board members eight years in a row.
  checked: false

governments:
- id: federal
  tier: 1
  name: United States
- id: state
  tier: 2
  name: State of Florida
- id: county
  tier: 3
  name: "{county} County"
- id: city
  tier: 4
  name: "City of {city}"
- id: school
  tier: beside
  name: "{school}"
- id: district
  tier: beside
  name: Other districts

offices:
- {id: us.president, government: federal, title: President, kind: executive, seats: 1, area: the country, chosen: elected, partisan: true, term: 4, next: [2028], every: 4, player: yes, checked: true}
- {id: us.senator, government: federal, title: United States Senator, kind: legislator, seats: 2, area: the state, chosen: elected, partisan: true, term: 6, next: [2026, 2028], every: 6, player: yes, checked: false, note: One seat has a special election in 2026 to finish a term.}
- {id: us.representative, government: federal, title: United States Representative, kind: legislator, seats: 1, of: 28, area: "Congressional District {cd}", chosen: elected, partisan: true, term: 2, next: [2026], every: 2, player: yes, checked: true, source: Census district lines}

- {id: fl.governor, government: state, title: Governor, kind: executive, seats: 1, area: the state, chosen: elected, partisan: true, term: 4, next: [2026], every: 4, player: yes, checked: false, note: Runs on one ticket with the Lieutenant Governor.}
