- {id: county.register_of_deeds, government: county, title: Register of Deeds, kind: row officer, seats: 1, area: the county, chosen: elected, partisan: true, term: 4, next: [2028], every: 4, player: yes, checked: false}
- {id: county.sheriff, government: county, title: Sheriff, kind: row officer, seats: 1, area: the county, chosen: elected, partisan: true, term: 4, next: [2028], every: 4, player: yes, checked: false}
- {id: county.attorney, government: county, title: County Attorney, kind: row officer, seats: 1, area: the county, chosen: elected, partisan: true, term: 4, next: [2028], every: 4, player: yes, checked: false, note: Must be a lawyer.}

- {id: township.trustee, government: township, title: Township Trustee, kind: executive, seats: 1, area: the township, chosen: elected, partisan: true, term: 4, next: [2028], every: 4, player: yes, checked: true, source: K.S.A. 25-1601}
- {id: township.treasurer, government: township, title: Township Treasurer, kind: row officer, seats: 1, area: the township, chosen: elected, partisan: true, term: 4, next: [2028], every: 4, player: yes, checked: true, source: K.S.A. 25-1601}
- {id: township.clerk, government: township, title: Township Clerk, kind: row officer, seats: 1, area: the township, chosen: elected, partisan: true, term: 4, next: [2026], every: 4, player: yes, checked: true, source: K.S.A. 25-1601}

