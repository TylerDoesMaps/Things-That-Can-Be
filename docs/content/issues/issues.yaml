note: 'Issues every pop and character holds a position on. Positive is the left end. ''stops'' are the positions a character can take, each at a fixed value. ''weights'' are local, state, national (0 ignored,
  3 central). ''nation'' is where the average American sits, placed by hand. ''florida'' is the state''s distance from the nation in the survey, kept within 15. ''pulls'' are points added if a whole pop
  were that group: party pulls use the pop''s party pie, church, union and business use its share of members. Pulls marked hand-set are guesses; the rest are fitted from the survey named in ''source''.
  ''spread'' widens every pop''s distance from the state average, to stand for the sorting of like-minded people that a party pie does not capture; a party''s usual stop is worked out without it. Exurban
  pulls are hand-set: the survey has no such category.'
spread: 1.5
