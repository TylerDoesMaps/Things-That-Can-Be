# Taxation: the first category of the policy list, and the pattern for the rest.
#
# A policy folds under a position (an issue in issues.yaml). `dir` is +1 when a higher value of the
# policy is the position's positive side, -1 when it is the negative side.
# A policy is held by one or more levels: federal, state, county, city, school. Each level has its own values.
# A sub-policy holds a real unit: percent, dollars, mills, cents, days, years or yesno.
#   main      the sub-policy a pop holds an ideal for, and the one the rating is read from, per level
#   dir       +1 when raising the sub-policy raises the tax, -1 when raising it cuts the tax
#   per_pop   the value given is per pop and is multiplied by the government's pops
#   limits    this sub-policy is the top value lower levels may set for another sub-policy
# `absent` lists levels that may hold the policy but do not; a bill can create it, starting from `create`.
# `barred` lists levels where a constitution rules it out.
# `revenue` is a rough yearly yield per level, written with the sub-policy ids, the government's bases
# (income, wages, value, sales, gallons, rooms, profits, homes, new_homes) and `up`, the state's values.
# Federal figures are what is collected in Florida.
# Values marked "check" are from memory and have not been checked against a source.

year: 2026
drift: 0.5          # how far a pop's ideal sits from today's value at a position score of 100
bands_tax: [None, Low, Moderate, High, Punishing]
bands_spend: [None, Small, Moderate, Large, Lavish]

bases:               # statewide totals a year, shared out among pops; all rough
  income: 1.6e12     # personal income
  wages: 7.5e11
  value: 3.3e12      # taxable property value
  sales: 6.0e11      # taxable sales
  gallons: 1.1e10    # motor fuel sold
  rooms: 3.0e10      # spent on rooms
  profits: 1.0e11    # taxable company income
  homes: 45          # per pop
  new_homes: 0.7     # per pop, a year

policies:
  - id: personal_income_tax
    name: Personal income tax
    position: income_tax
    dir: 1
    held: [federal, state]
    absent: [state]
    barred: {state: Constitution of Florida}
    main: {federal: top_rate, state: top_rate}
    rating: {federal: [1, 25, 35, 45], state: [0.1, 4, 7, 10]}
    subs:
      - {id: top_rate, name: Top rate, unit: percent, min: 0, max: 70, step: 0.5}
      - {id: bottom_rate, name: Bottom rate, unit: percent, min: 0, max: 30, step: 0.5}
      - {id: top_starts, name: Top bracket starts at, unit: dollars, min: 100000, max: 5000000, step: 10000, dir: -1}
      - {id: standard_deduction, name: Standard deduction, unit: dollars, min: 0, max: 40000, step: 100, dir: -1}
      - {id: capital_gains, name: Capital gains rate, unit: percent, min: 0, max: 50, step: 0.5}
    values:
      federal: {top_rate: 37, bottom_rate: 10, top_starts: 640600, standard_deduction: 16100, capital_gains: 20}   # check
    create:
      state: {top_rate: 5, bottom_rate: 2, top_starts: 200000, standard_deduction: 12000, capital_gains: 5}
    revenue:
      federal: "income * (0.06*bottom_rate/10 + 0.075*top_rate/37*Math.pow(640600/top_starts,0.2) + 0.02*capital_gains/20) * (1 - 0.1*(standard_deduction/16100-1))"
      state: "income * (0.012*bottom_rate/2 + 0.018*top_rate/5*Math.pow(200000/top_starts,0.2) + 0.004*capital_gains/5) * (1 - 0.1*(standard_deduction/12000-1))"

  - id: social_security_tax
    name: Social Security taxes
    position: income_tax
    dir: 1
    held: [federal]
    main: {federal: rate}
    rating: {federal: [1, 9, 14, 18]}
    subs:
      - {id: rate, name: General rate, unit: percent, min: 0, max: 25, step: 0.1}
      - {id: cap, name: Top income cap, unit: dollars, min: 50000, max: 2000000, step: 500}
    values:
      federal: {rate: 12.4, cap: 184500}
    revenue:
      federal: "wages * rate/100 * Math.min(1, 0.83*Math.pow(cap/184500,0.12))"

  - id: medicare_tax
    name: Medicare tax
    position: income_tax
    dir: 1
    held: [federal]
    main: {federal: rate}
    rating: {federal: [0.1, 2, 4, 6]}
    subs:
      - {id: rate, name: General rate, unit: percent, min: 0, max: 10, step: 0.1}
      - {id: surtax, name: Surtax on high earners, unit: percent, min: 0, max: 5, step: 0.1}
    values:
      federal: {rate: 2.9, surtax: 0.9}
    revenue:
      federal: "wages * (rate/100 + 0.12*surtax/100)"

  - id: property_tax
    name: Property tax
    position: property_tax
    dir: 1
    held: [state, county, city, school]
    main: {state: top_rate_allowed, county: rate, city: rate, school: rate}
    rating: {county: [0.1, 4, 7.5, 9.5], city: [0.1, 3, 6, 9], school: [0.1, 4, 7.5, 9.5]}
    subs:
      - {id: rate, name: Rate, unit: mills, min: 0, max: 20, step: 0.05, levels: [county, city, school]}
      - {id: homestead, name: Homestead exemption, unit: dollars, min: 0, max: 250000, step: 1000, dir: -1, levels: [state]}
      - {id: assessment_cap, name: Yearly cap on assessment growth, unit: percent, min: 0, max: 15, step: 0.5, levels: [state]}
      - {id: top_rate_allowed, name: "Top rate a county, city or school district may set", unit: mills, min: 0, max: 20, step: 0.5, levels: [state], limits: {sub: rate, levels: [county, city, school]}}
    values:
      state: {homestead: 50000, assessment_cap: 3, top_rate_allowed: 10}
      county: {rate: 7}          # placeholder, the same for every county
      city: {rate: 5}            # placeholder, the same for every city
      school: {rate: 6.5}        # placeholder, the same for every district
    revenue:
      state: "0"
      county: "value * rate/1000 * (1 - 0.1*(up.homestead/50000-1)) * (1 + 0.02*(up.assessment_cap-3))"
      city: "value * rate/1000 * (1 - 0.1*(up.homestead/50000-1)) * (1 + 0.02*(up.assessment_cap-3))"
      school: "value * rate/1000 * (1 - 0.1*(up.homestead/50000-1)) * (1 + 0.02*(up.assessment_cap-3))"

  - id: special_assessments
    name: Special assessments
    position: property_tax
    dir: 1
    held: [county, city]
    absent: [county]
    main: {county: fire_fee, city: fire_fee}
    rating: {county: [1, 100, 250, 400], city: [1, 100, 250, 400]}
    subs:
      - {id: fire_fee, name: Fire fee per home, unit: dollars, min: 0, max: 800, step: 5}
      - {id: stormwater_fee, name: Stormwater fee per home, unit: dollars, min: 0, max: 600, step: 5}
    values:
      city: {fire_fee: 150, stormwater_fee: 90}      # placeholder
    create:
      county: {fire_fee: 150, stormwater_fee: 90}
    revenue:
      county: "homes * (fire_fee + stormwater_fee)"
      city: "homes * (fire_fee + stormwater_fee)"

  - id: sales_tax
    name: Sales tax
    position: sales_tax
    dir: -1
    held: [state, county]
    main: {state: rate, county: rate}
    rating: {state: [0.1, 4, 6.5, 8], county: [0.1, 0.75, 1.6, 2.5]}
    subs:
      - {id: rate, name: General rate, unit: percent, min: 0, max: 12, step: 0.25}
      - {id: groceries, name: Groceries taxed, unit: yesno, levels: [state]}
      - {id: holidays, name: Yearly tax holidays, unit: days, min: 0, max: 120, step: 1, dir: -1, levels: [state]}
      - {id: top_county_rate, name: Top rate a county may set, unit: percent, min: 0, max: 5, step: 0.25, levels: [state], limits: {sub: rate, levels: [county]}}
    values:
      state: {rate: 6, groceries: 0, holidays: 31, top_county_rate: 1.5}    # holidays and the county top: check
      county: {rate: 1}          # placeholder
    revenue:
      state: "sales * rate/100 * (groceries ? 1.12 : 1) * (1 - 0.004*holidays/31)"
      county: "sales * rate/100 * (up.groceries ? 1.12 : 1)"

  - id: fuel_tax
    name: Fuel tax
    position: sales_tax
    dir: -1
    held: [federal, state, county]
    main: {federal: rate, state: rate, county: rate}
    rating: {federal: [0.1, 15, 25, 40], state: [0.1, 20, 35, 50], county: [0.1, 4, 9, 13]}
    subs:
      - {id: rate, name: Rate, unit: cents, min: 0, max: 80, step: 0.1}
    values:
      federal: {rate: 18.4}
      state: {rate: 31}          # check
      county: {rate: 6}          # placeholder
    revenue:
      federal: "gallons * rate/100"
      state: "gallons * rate/100"
      county: "gallons * rate/100"

  - id: tourist_tax
    name: Tourist tax
    position: sales_tax
    dir: -1
    held: [county]
    main: {county: rate}
    rating: {county: [0.1, 3, 5.5, 7]}
    subs:
      - {id: rate, name: Rate on rooms, unit: percent, min: 0, max: 10, step: 0.5}
    values:
      county: {rate: 5}          # placeholder
    revenue:
      county: "rooms * rate/100"

  - id: corporate_income_tax
    name: Corporate income tax
    position: business_tax
    dir: 1
    held: [federal, state]
    main: {federal: rate, state: rate}
    rating: {federal: [0.1, 15, 25, 32], state: [0.1, 4, 7, 10]}
    subs:
      - {id: rate, name: Rate, unit: percent, min: 0, max: 50, step: 0.25}
      - {id: exempt, name: Exempt first income, unit: dollars, min: 0, max: 1000000, step: 5000, dir: -1, scale: 50000}
    values:
      federal: {rate: 21, exempt: 0}
      state: {rate: 5.5, exempt: 50000}
    revenue:
      federal: "profits * rate/100 * (1 - 0.05*exempt/50000)"
      state: "profits * rate/100 * (1 - 0.05*exempt/50000)"

  - id: incentives
    name: Incentives
    position: business_tax
    dir: -1
    spend: true
    held: [state, county, city]
    main: {state: budget, county: budget, city: budget}
    rating_per_pop: {state: [1, 1000, 4000, 10000], county: [1, 500, 2000, 5000], city: [1, 300, 1200, 3000]}
    subs:
      - {id: budget, name: Yearly incentive budget, unit: dollars, min: 0, max_mult: 6, step_mult: 0.01, per_pop: true}
      - {id: longest_break, name: Longest tax break, unit: years, min: 0, max: 30, step: 1}
    values:
      state: {budget: 2000, longest_break: 10}       # check
      county: {budget: 800, longest_break: 10}       # placeholder
      city: {budget: 400, longest_break: 10}         # placeholder
    revenue:
      state: "-budget"
      county: "-budget"
      city: "-budget"

  - id: impact_fees
    name: Impact fees
    position: business_tax
    dir: 1
    held: [county, city]
    main: {county: fee, city: fee}
    rating: {county: [1, 2500, 8000, 15000], city: [1, 1500, 5000, 10000]}
    subs:
      - {id: fee, name: Fee per new home, unit: dollars, min: 0, max: 30000, step: 100}
    values:
      county: {fee: 5000}        # placeholder
      city: {fee: 3000}          # placeholder
    revenue:
      county: "new_homes * fee"
      city: "new_homes * fee"
