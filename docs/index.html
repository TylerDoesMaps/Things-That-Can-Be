<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Things That Can Be</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span class="mark">Things That Can Be</span>
  <nav><a href="index.html" aria-current="page">Election Night</a><a href="map.html">Map</a><a href="builder.html">Events</a><a href="government.html">Government</a></nav>
</header>

<section class="board">
  <div class="side dem"><span class="who" id="dem-name"></span><span class="ev" id="dem-ev"></span><span class="pv" id="dem-pv"></span></div>
  <div class="bar"><i id="dem-bar"></i><i id="rep-bar"></i><b></b></div>
  <div class="side rep"><span class="who" id="rep-name"></span><span class="ev" id="rep-ev"></span><span class="pv" id="rep-pv"></span></div>
</section>

<section class="controls">
  <div class="tabs" id="levels"></div>
  <div class="tabs" id="years"></div>
  <div class="shift">
    <label for="shift">Shift</label>
    <input id="shift" type="range" min="-20" max="20" step="0.1" value="0">
    <output id="shift-value"></output>
    <button id="shift-reset" type="button">Reset</button>
  </div>
</section>

<main>
  <div id="map"></div>
  <div id="tip" hidden></div>
</main>

<footer>
  <div class="legend" id="legend"></div>
  <a href="https://github.com/TylerDoesMaps/Things-That-Can-Be#sources">Sources</a>
</footer>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="app.js"></script>
</body>
</html>
